name: doce-maria-pricing-auth
services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - identity_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  auth:
    build: .
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8002:8002"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: doce_maria_identity
      JWT_PRIVATE_KEY_PATH: /srv/.keys/access-private.pem
      JWT_PUBLIC_KEY_PATH: /srv/.keys/access-public.pem
      JWT_ISSUER: doce-maria-pricing-auth
      JWT_AUDIENCE: pricing-api
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    volumes:
      - ./.keys:/srv/.keys:ro
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  identity_mongo:

